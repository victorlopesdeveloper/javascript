<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imigração</title>
</head>
<body>
    <h1>Em que País você vive?</h1>
    Adicione o seu endereço: <input type="text" name="txtend" id="itxtend">
    <input type="button" value="verificar" onclick="endereco()">
    <div id="res">

    </div>

    <script>
    function endereco(){
        let local = document.querySelector("input#itxtend")
        let resposta = document.querySelector('div#res')
        let valorDoLocal = local.value
        if(valorDoLocal == 'Brasil'){
            resposta.innerHTML = `<p>Você é <strong>Brasileiro!</strong></p>`
        }else{
            resposta.innerHTML += `<p>Você é <strong>Estrangeiro!</strong></p>`
        }
    }
    
    
    </script>
</body>
</html>
