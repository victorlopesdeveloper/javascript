<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <main>
        <div id="entrada">
            <div id="primeira-div">
                <p>Número (entre 1 e 100): </p>
                <input type="number" name="num" id="inum">
                <input type="submit" value="Adicionar" id="iadicionar" onclick="adicionar()">
            </div>
            <select name="tabuda" id="lista" size="10">
                <option></option>
            </select>
            <input type="submit" value="Finalizar" onclick="finalizar()">
        </div>
        <div id="saida">
            
        </div>
    </main>
    <footer>
        <p>&copy; Victor Lopes</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
